<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lola AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        /* Orbe de voz animado */
        .voice-orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-orb .core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f5ff, #0066ff);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
            transition: all 0.3s ease;
        }

        .voice-orb .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 245, 255, 0.3);
            animation: pulse-ring 2s ease-out infinite;
        }

        .voice-orb .ring:nth-child(2) { width: 100px; height: 100px; animation-delay: 0s; }
        .voice-orb .ring:nth-child(3) { width: 130px; height: 130px; animation-delay: 0.4s; }
        .voice-orb .ring:nth-child(4) { width: 160px; height: 160px; animation-delay: 0.8s; }

        /* Estado: Escuchando */
        body.listening .voice-orb .core {
            background: radial-gradient(circle, #00ff88, #00cc66);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
            transform: scale(1.1);
        }

        body.listening .voice-orb .ring {
            border-color: rgba(0, 255, 136, 0.4);
            animation: pulse-ring 1s ease-out infinite;
        }

        /* Estado: Hablando */
        body.speaking .voice-orb .core {
            background: radial-gradient(circle, #ff6600, #ff3300);
            box-shadow: 0 0 50px rgba(255, 102, 0, 0.7);
            animation: speak-pulse 0.15s ease-in-out infinite alternate;
        }

        body.speaking .voice-orb .ring {
            border-color: rgba(255, 102, 0, 0.4);
            animation: pulse-ring 0.5s ease-out infinite;
        }

        /* Estado: Pensando */
        body.thinking .voice-orb .core {
            background: radial-gradient(circle, #aa66ff, #6600cc);
            box-shadow: 0 0 40px rgba(170, 102, 255, 0.6);
            animation: think-spin 1.5s linear infinite;
        }

        /* Barras de voz (cuando habla) */
        .voice-bars {
            display: flex;
            gap: 4px;
            justify-content: center;
            height: 60px;
            align-items: flex-end;
            margin-bottom: 30px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        body.speaking .voice-bars { opacity: 1; }

        .voice-bars .bar {
            width: 6px;
            background: linear-gradient(to top, #ff6600, #ff3300);
            border-radius: 3px;
            animation: bar-dance 0.5s ease-in-out infinite alternate;
        }

        .voice-bars .bar:nth-child(1) { animation-delay: 0.0s; height: 20px; }
        .voice-bars .bar:nth-child(2) { animation-delay: 0.1s; height: 35px; }
        .voice-bars .bar:nth-child(3) { animation-delay: 0.05s; height: 25px; }
        .voice-bars .bar:nth-child(4) { animation-delay: 0.15s; height: 45px; }
        .voice-bars .bar:nth-child(5) { animation-delay: 0.02s; height: 30px; }
        .voice-bars .bar:nth-child(6) { animation-delay: 0.12s; height: 50px; }
        .voice-bars .bar:nth-child(7) { animation-delay: 0.08s; height: 35px; }
        .voice-bars .bar:nth-child(8) { animation-delay: 0.18s; height: 40px; }
        .voice-bars .bar:nth-child(9) { animation-delay: 0.03s; height: 25px; }
        .voice-bars .bar:nth-child(10) { animation-delay: 0.13s; height: 30px; }
        .voice-bars .bar:nth-child(11) { animation-delay: 0.07s; height: 45px; }
        .voice-bars .bar:nth-child(12) { animation-delay: 0.16s; height: 20px; }

        /* Nombre */
        .name {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #00f5ff;
            margin-bottom: 10px;
        }

        /* Estado */
        .status {
            font-size: 14px;
            color: #666;
            letter-spacing: 2px;
            margin-bottom: 30px;
            transition: color 0.3s;
        }

        body.listening .status { color: #00ff88; }
        body.speaking .status { color: #ff6600; }
        body.thinking .status { color: #aa66ff; }

        /* Texto de respuesta */
        .response {
            font-size: 16px;
            color: #aaa;
            max-width: 90%;
            margin: 0 auto;
            line-height: 1.6;
            min-height: 50px;
            transition: color 0.3s;
        }

        body.speaking .response { color: #fff; }

        /* Animaciones */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes speak-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        @keyframes think-spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(0.9); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes bar-dance {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        /* Hora */
        .clock {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #333;
        }

        .greeting {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 12px;
            color: #333;
        }
    </style>
</head>
<body id="body">
    <div class="greeting" id="greeting">Ing. Alfonso Tinajero</div>
    <div class="clock" id="clock"></div>

    <div class="container">
        <div class="voice-orb">
            <div class="core"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <div class="voice-bars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="name">LOLA</div>
        <div class="status" id="status">Lista para escuchar</div>
        <div class="response" id="response">Di "Lola" para activar...</div>
    </div>

    <script>
        // Reloj
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = 
                now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simulación de estados (se conectará al backend de Lola)
        const body = document.getElementById('body');
        const status = document.getElementById('status');
        const response = document.getElementById('response');

        // API: cambiar estado desde Lola
        function setState(state, text) {
            body.className = state;
            switch(state) {
                case 'listening':
                    status.textContent = '🎤 Escuchando...';
                    break;
                case 'thinking':
                    status.textContent = '🧠 Procesando...';
                    break;
                case 'speaking':
                    status.textContent = '🔊 Hablando...';
                    if (text) response.textContent = text;
                    break;
                default:
                    status.textContent = 'Lista para escuchar';
                    body.className = '';
            }
        }

        function setResponse(text) {
            response.textContent = text;
        }

        // Polling al backend de Lola para obtener estado
        async function pollStatus() {
            try {
                const resp = await fetch('http://127.0.0.1:8181/status');
                if (resp.ok) {
                    const data = await resp.json();
                    setState(data.state, data.text);
                    if (data.response) setResponse(data.response);
                }
            } catch(e) {}
            setTimeout(pollStatus, 300);
        }
        pollStatus();
    </script>
</body>
</html>
